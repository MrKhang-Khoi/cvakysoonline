<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGCA Sign Tool Pro - PDF Viewer</title>
    <script src="pdfjs/pdf.min.js"></script>
    <script src="xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        /* BẢNG TÍNH EXCEL INTERACTIVE */
        #excel-container {
            display: none;
            width: 100%;
            min-height: 100%;
            background-color: #f1f5f9;
            padding: 16px;
            flex-direction: column;
            align-items: center;
        }
        .excel-toolbar {
            width: 100%;
            max-width: 1100px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            flex-wrap: wrap;
            gap: 10px;
        }
        .excel-sheet-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 60%;
        }
        .excel-sheet-tab {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            cursor: pointer;
            color: #334155;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .excel-sheet-tab:hover {
            background: #e2e8f0;
        }
        .excel-sheet-tab.active {
            background: #16a34a;
            color: white;
            border-color: #15803d;
        }
        .excel-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .excel-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: white;
            cursor: pointer;
            color: #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .excel-btn:hover {
            background: #f1f5f9;
        }
        .excel-btn.active {
            background: #0284c7;
            color: white;
            border-color: #0369a1;
        }
        .excel-btn-primary {
            background: #d97706;
            color: white;
            border-color: #b45309;
        }
        .excel-btn-primary:hover {
            background: #b45309;
        }
        .excel-paper-wrapper {
            background: white;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
            border: 1px solid #cbd5e1;
            padding: 20mm 15mm;
            margin-bottom: 40px;
            transition: all 0.3s;
            overflow-x: auto;
            min-height: 297mm;
            width: 210mm; /* A4 Portrait */
        }
        .excel-paper-wrapper.landscape {
            width: 297mm;
            min-height: 210mm;
            padding: 15mm 15mm;
        }
        .excel-paper-wrapper.fit-width {
            width: 98% !important;
            max-width: 1400px;
            padding: 12mm;
        }
        .excel-table {
            border-collapse: collapse;
            width: 100%;
            font-family: 'Times New Roman', Times, serif, 'Segoe UI';
            font-size: 13px;
            color: #111827;
            background: white;
        }
        .excel-table th, .excel-table td {
            border: 1px solid #4b5563;
            padding: 6px 8px;
            min-width: 32px;
            min-height: 22px;
            vertical-align: middle;
            line-height: 1.35;
            outline: none;
        }
        .excel-table td[contenteditable="true"]:focus {
            background-color: #eff6ff !important;
            box-shadow: inset 0 0 0 2px #2563eb;
        }
        @media print {
            body, html {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #loading-overlay, #viewer-container, .excel-toolbar {
                display: none !important;
            }
            #excel-container {
                display: block !important;
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .excel-paper-wrapper {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                min-height: auto !important;
            }
            .excel-table th, .excel-table td {
                border-color: #000 !important;
            }
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #525659;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            width: 100%;
            height: 100%;
        }
        #viewer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 80px 10px;
            gap: 20px;
        }
        .page-wrapper {
            position: relative;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
            border-radius: 2px;
            margin-bottom: 10px;
            cursor: default;
        }
        .page-canvas {
            display: block;
        }
        .page-badge {
            position: absolute;
            top: -24px;
            left: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #f1f5f9;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 3px;
        }

        /* KHUNG CHỮ KÝ / CON DẤU KÉO THẢ TƯƠNG TÁC */
        .interactive-stamp-box {
            position: absolute;
            border: 2px dashed #2563eb;
            background-color: rgba(37, 99, 235, 0.08);
            cursor: move;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            touch-action: none;
        }
        .interactive-stamp-box:hover {
            border-color: #1d4ed8;
            background-color: rgba(37, 99, 235, 0.12);
        }
        .stamp-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        .stamp-info-bar {
            position: absolute;
            top: -26px;
            left: 0;
            background: #1e3a8a;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        .stamp-close-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 22px;
            height: 22px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            border: 2px solid white;
            z-index: 1001;
        }
        .stamp-close-btn:hover {
            background: #b91c1c;
            transform: scale(1.1);
        }
        /* CÁC PHÍM KÉO CO GIÃN (RESIZE HANDLES) */
        .stamp-resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #2563eb;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .resize-se {
            right: -6px;
            bottom: -6px;
            cursor: nwse-resize;
        }
        .resize-sw {
            left: -6px;
            bottom: -6px;
            cursor: nesw-resize;
        }
        .resize-ne {
            right: -6px;
            top: -6px;
            cursor: nesw-resize;
        }
        .resize-nw {
            left: -6px;
            top: -6px;
            cursor: nwse-resize;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #525659;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" style="font-size: 14px; font-weight: 500;">Đang nạp tài liệu PDF...</div>
    </div>

    <!-- KHUNG XEM VÀ CHỈNH SỬA BẢNG TÍNH EXCEL TRỰC TIẾP -->
    <div id="excel-container">
        <div class="excel-toolbar">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 16px;">📊</span>
                <span id="excel-file-name-label" style="font-weight: bold; font-size: 13px; color: #1e293b;">Bảng Tính Excel</span>
            </div>

            <!-- TABS CHỌN SHEET -->
            <div id="excel-sheet-tabs" class="excel-sheet-tabs"></div>

            <!-- CÁC NÚT ĐIỀU KHIỂN TRANG IN -->
            <div class="excel-controls">
                <button type="button" class="excel-btn active" id="btn-excel-landscape" onclick="setExcelOrientation('landscape')" title="Định dạng in khổ ngang A4 (Thích hợp cho bảng điểm, bảng lương)">
                    📄 Khổ Ngang A4
                </button>
                <button type="button" class="excel-btn" id="btn-excel-portrait" onclick="setExcelOrientation('portrait')" title="Định dạng in khổ dọc A4">
                    📄 Khổ Dọc A4
                </button>
                <button type="button" class="excel-btn" id="btn-excel-fit-width" onclick="toggleExcelFitWidth()" title="Tự động co giãn bảng tính vừa khít chiều rộng trang in A4">
                    ↔ Vừa Khít Chiều Ngang
                </button>
                <button type="button" class="excel-btn excel-btn-primary" onclick="requestExportExcelPdf()" title="Chuyển đổi bảng tính sang PDF để ký số">
                    ⚡ Chuyển Sang PDF Để Ký
                </button>
            </div>
        </div>

        <!-- TỜ GIẤY IN A4 MÔ PHỎNG CHỨA BẢNG TÍNH -->
        <div id="excel-paper" class="excel-paper-wrapper landscape"></div>
    </div>

    <div id="viewer-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';

        let currentPdf = null;
        let renderedPages = [];
        let activeStamp = null;
        let stampConfig = {
            imageUrl: '',
            widthPx: 140,
            heightPx: 140
        };

        // QUẢN LÝ BẢNG TÍNH EXCEL TƯƠNG TÁC
        let currentWorkbook = null;
        let currentExcelSheetName = '';
        let currentExcelOrientation = 'landscape';
        let isExcelFitWidth = false;

        function loadExcelFromBase64(base64Data, fileName) {
            if (!base64Data || typeof base64Data !== 'string') {
                console.error('loadExcelFromBase64: invalid input');
                return;
            }

            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) loadingOverlay.style.display = 'flex';
            const loadingText = document.getElementById('loading-text');
            if (loadingText) loadingText.innerText = 'Đang phân tích cấu trúc bảng tính Excel...';

            // Ẩn PDF viewer và hiện Excel container
            const pdfContainer = document.getElementById('viewer-container');
            if (pdfContainer) pdfContainer.style.display = 'none';

            const excelContainer = document.getElementById('excel-container');
            if (excelContainer) excelContainer.style.display = 'flex';

            removeStamp();

            try {
                const cleanBase64 = base64Data.includes(',') ? base64Data.split(',')[1] : base64Data;
                const binaryString = atob(cleanBase64.trim());
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                currentWorkbook = XLSX.read(bytes, {
                    type: 'array',
                    cellStyles: true,
                    cellDates: true,
                    cellNF: true
                });

                if (!currentWorkbook || !currentWorkbook.SheetNames || currentWorkbook.SheetNames.length === 0) {
                    throw new Error('Tệp Excel không chứa bảng tính nào.');
                }

                document.getElementById('excel-file-name-label').innerText = fileName || 'Bảng Tính Excel';
                currentExcelSheetName = currentWorkbook.SheetNames[0];
                renderExcelSheetTabs();
                renderCurrentExcelSheet();

                if (loadingOverlay) loadingOverlay.style.display = 'none';

                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'excelLoaded',
                        fileName: fileName,
                        sheetCount: currentWorkbook.SheetNames.length,
                        firstSheet: currentExcelSheetName,
                        orientation: currentExcelOrientation
                    });
                }
            } catch (err) {
                if (loadingOverlay) loadingOverlay.style.display = 'none';
                console.error('Lỗi nạp Excel:', err);
                alert('Không thể mở tệp Excel: ' + (err.message || err));
            }
        }

        function renderExcelSheetTabs() {
            const tabsContainer = document.getElementById('excel-sheet-tabs');
            if (!tabsContainer || !currentWorkbook) return;
            tabsContainer.textContent = '';

            currentWorkbook.SheetNames.forEach(sheetName => {
                const tab = document.createElement('div');
                tab.className = 'excel-sheet-tab' + (sheetName === currentExcelSheetName ? ' active' : '');
                tab.innerText = '📊 ' + sheetName;
                tab.onclick = () => {
                    currentExcelSheetName = sheetName;
                    renderExcelSheetTabs();
                    renderCurrentExcelSheet();
                };
                tabsContainer.appendChild(tab);
            });
        }

        function renderCurrentExcelSheet() {
            if (!currentWorkbook || !currentExcelSheetName) return;
            const ws = currentWorkbook.Sheets[currentExcelSheetName];
            if (!ws) return;

            const paper = document.getElementById('excel-paper');
            if (!paper) return;

            // Xuất HTML từ SheetJS (giữ nguyên merge cell, cấu trúc bảng)
            const rawHtml = XLSX.utils.sheet_to_html(ws, { editable: true });
            paper.textContent = '';
            const parser = new DOMParser();
            const parsedDoc = parser.parseFromString(rawHtml, 'text/html');
            const table = parsedDoc.querySelector('table');
            if (table) {
                table.className = 'excel-table';
                table.querySelectorAll('td').forEach(td => {
                    td.setAttribute('contenteditable', 'true');
                    td.setAttribute('spellcheck', 'false');
                });
                paper.appendChild(table);
            }
        }

        function setExcelOrientation(orientation) {
            currentExcelOrientation = orientation;
            const paper = document.getElementById('excel-paper');
            const btnLandscape = document.getElementById('btn-excel-landscape');
            const btnPortrait = document.getElementById('btn-excel-portrait');

            if (orientation === 'landscape') {
                paper.classList.add('landscape');
                btnLandscape.classList.add('active');
                btnPortrait.classList.remove('active');
            } else {
                paper.classList.remove('landscape');
                btnPortrait.classList.add('active');
                btnLandscape.classList.remove('active');
            }

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'excelOrientationChanged',
                    orientation: orientation
                });
            }
        }

        function toggleExcelFitWidth() {
            isExcelFitWidth = !isExcelFitWidth;
            const paper = document.getElementById('excel-paper');
            const btnFit = document.getElementById('btn-excel-fit-width');

            if (isExcelFitWidth) {
                paper.classList.add('fit-width');
                btnFit.classList.add('active');
            } else {
                paper.classList.remove('fit-width');
                btnFit.classList.remove('active');
            }
        }

        function requestExportExcelPdf() {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'requestExportExcelPdf',
                    orientation: currentExcelOrientation
                });
            }
        }

        function resetViewer() {
            if (window._pdfLoadAbort) window._pdfLoadAbort.aborted = true;
            removeStamp();
            const container = document.getElementById('viewer-container');
            if (container) {
                container.querySelectorAll('canvas').forEach(c => { c.width = 0; c.height = 0; });
                container.textContent = '';
                container.style.display = 'none';
            }
            const excelContainer = document.getElementById('excel-container');
            if (excelContainer) {
                excelContainer.style.display = 'none';
                const tbody = document.getElementById('excel-table-body');
                if (tbody) tbody.textContent = '';
                const thead = document.getElementById('excel-table-head');
                if (thead) thead.textContent = '';
            }
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) loadingOverlay.style.display = 'none';
            currentPdf = null;
            renderedPages = [];
            currentWorkbook = null;
            currentSheetName = null;
        }

        async function loadPdfFromBase64(base64Data) {
            if (!base64Data || typeof base64Data !== 'string') {
                console.error('loadPdfFromBase64: invalid input');
                return;
            }

            if (window._pdfLoadAbort) window._pdfLoadAbort.aborted = true;
            const abortFlag = { aborted: false };
            window._pdfLoadAbort = abortFlag;

            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) loadingOverlay.style.display = 'flex';
            const loadingText = document.getElementById('loading-text');
            if (loadingText) loadingText.innerText = 'Đang phân tích cấu trúc trang PDF...';

            const excelContainer = document.getElementById('excel-container');
            if (excelContainer) excelContainer.style.display = 'none';

            const container = document.getElementById('viewer-container');
            if (!container) {
                if (loadingOverlay) loadingOverlay.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            container.querySelectorAll('canvas').forEach(c => { c.width = 0; c.height = 0; });
            container.textContent = '';
            renderedPages = [];
            removeStamp();

            try {
                const cleanBase64 = base64Data.includes(',') ? base64Data.split(',')[1] : base64Data;
                if (!/^[A-Za-z0-9+/\s]+=*$/.test(cleanBase64.trim())) {
                    throw new Error('Invalid base64 encoding');
                }
                const binaryString = atob(cleanBase64.trim());
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                currentPdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                const totalPages = currentPdf.numPages;

                // Tính toán viewport tối ưu cho độ phân giải màn hình (~820px chiều rộng cho khổ A4)
                const targetWidth = Math.min(window.innerWidth - 60, 850);

                // ponytail: serial render, upgrade to chunked/virtualized if >20 pages needed
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    if (abortFlag.aborted) return;
                    const page = await currentPdf.getPage(pageNum);
                    const unscaledViewport = page.getViewport({ scale: 1.0 });
                    const scale = targetWidth / unscaledViewport.width;
                    const viewport = page.getViewport({ scale: scale });

                    const wrapper = document.createElement('div');
                    wrapper.className = 'page-wrapper';
                    wrapper.id = `page-wrapper-${pageNum}`;
                    wrapper.dataset.pageNumber = pageNum;
                    wrapper.dataset.pdfWidthPt = unscaledViewport.width;
                    wrapper.dataset.pdfHeightPt = unscaledViewport.height;
                    wrapper.dataset.renderWidthPx = viewport.width;
                    wrapper.dataset.renderHeightPx = viewport.height;
                    wrapper.dataset.scale = scale;
                    wrapper.style.width = `${viewport.width}px`;
                    wrapper.style.height = `${viewport.height}px`;

                    const badge = document.createElement('div');
                    badge.className = 'page-badge';
                    badge.innerText = `Trang ${pageNum} / ${totalPages}`;
                    wrapper.appendChild(badge);

                    const canvas = document.createElement('canvas');
                    canvas.className = 'page-canvas';
                    canvas.width = Math.round(viewport.width);
                    canvas.height = Math.round(viewport.height);
                    wrapper.appendChild(canvas);

                    container.appendChild(wrapper);

                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        console.error(`Không thể tạo canvas context cho trang ${pageNum}`);
                        continue;
                    }
                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    await page.render(renderContext).promise;

                    renderedPages.push({
                        pageNum: pageNum,
                        wrapper: wrapper,
                        pdfWidthPt: unscaledViewport.width,
                        pdfHeightPt: unscaledViewport.height,
                        scale: scale
                    });
                }

                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({ type: 'pdfLoaded', totalPages: totalPages });
                }
            } catch (err) {
                console.error("Lỗi nạp PDF:", err);
                alert("Không thể nạp file PDF. Vui lòng thử lại.");
            } finally {
                if (loadingOverlay) loadingOverlay.style.display = 'none';
            }
        }

        // HÀM CHÈN CON DẤU / CHỮ KÝ TAY VÀO VỊ TRÍ HIỂN THỊ TRỰC TIẾP
        function insertStamp(imageUrl, widthPx = 140, heightPx = 140) {
            const safeDataPattern = /^data:image\/(png|jpeg|gif|webp);base64,/;
            if (typeof imageUrl !== 'string' ||
                (!safeDataPattern.test(imageUrl) && !imageUrl.startsWith('/') && !imageUrl.startsWith('https://vgcaviewer.local/'))) {
                console.error('insertStamp: imageUrl không hợp lệ');
                return;
            }
            widthPx = Math.max(10, Math.min(Number(widthPx) || 140, 1000));
            heightPx = Math.max(10, Math.min(Number(heightPx) || 140, 1000));

            stampConfig.imageUrl = imageUrl;
            stampConfig.widthPx = widthPx;
            stampConfig.heightPx = heightPx;

            removeStamp();

            if (renderedPages.length === 0) return;

            // Tìm trang đang hiển thị nhiều nhất trong khung nhìn (Viewport)
            let maxVisibleHeight = -1;
            let targetPage = renderedPages[renderedPages.length - 1]; // Mặc định trang cuối

            for (const p of renderedPages) {
                const rect = p.wrapper.getBoundingClientRect();
                const visibleTop = Math.max(0, rect.top);
                const visibleBottom = Math.min(window.innerHeight, rect.bottom);
                const visibleHeight = Math.max(0, visibleBottom - visibleTop);
                if (visibleHeight > maxVisibleHeight) {
                    maxVisibleHeight = visibleHeight;
                    targetPage = p;
                }
            }

            const wrapper = targetPage.wrapper;
            const stampEl = document.createElement('div');
            stampEl.className = 'interactive-stamp-box';
            stampEl.id = 'active-stamp-element';

            // Đặt vị trí xuất hiện NGAY TRƯỚC TẦM MẮT NGƯỜI DÙNG trên trang đang xem
            const pageRect = wrapper.getBoundingClientRect();
            const viewportCenterY = window.innerHeight / 2;
            const targetY = (viewportCenterY - pageRect.top) - (heightPx / 2);
            const initialTop = Math.max(10, Math.min(targetY, wrapper.clientHeight - heightPx - 10));
            const preferredLeft = wrapper.clientWidth * 0.58;
            const initialLeft = Math.max(20, Math.min(preferredLeft, wrapper.clientWidth - widthPx - 40));

            stampEl.style.left = `${initialLeft}px`;
            stampEl.style.top = `${initialTop}px`;
            stampEl.style.width = `${widthPx}px`;
            stampEl.style.height = `${heightPx}px`;

            const coordsLabel = document.createElement('div');
            coordsLabel.className = 'stamp-info-bar';
            coordsLabel.id = 'stamp-coords-label';
            coordsLabel.textContent = 'Đang tính toán...';
            stampEl.appendChild(coordsLabel);

            const closeBtn = document.createElement('div');
            closeBtn.className = 'stamp-close-btn';
            closeBtn.title = 'Hủy chọn vị trí';
            closeBtn.textContent = '✕';
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                removeStamp();
            });
            stampEl.appendChild(closeBtn);

            const stampImg = document.createElement('img');
            stampImg.className = 'stamp-image';
            stampImg.src = imageUrl;
            stampImg.alt = 'Con dấu ký số';
            stampEl.appendChild(stampImg);

            for (const handleClass of ['resize-se', 'resize-sw', 'resize-ne', 'resize-nw']) {
                const handle = document.createElement('div');
                handle.className = `stamp-resize-handle ${handleClass}`;
                stampEl.appendChild(handle);
            }

            wrapper.appendChild(stampEl);
            activeStamp = {
                element: stampEl,
                pageNumber: targetPage.pageNum,
                wrapper: wrapper,
                targetPageObj: targetPage
            };

            setupStampDragAndResize(stampEl);
            updateStampCoordinates();

            // Cuộn nhẹ tới vị trí con dấu để người dùng nhìn thấy rõ ràng
            stampEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function removeStamp() {
            if (activeStamp && activeStamp.element) {
                activeStamp.element.remove();
            }
            activeStamp = null;
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ type: 'stampRemoved' });
            }
        }

        function setupStampDragAndResize(stampEl) {
            let isDragging = false;
            let isResizing = false;
            let currentResizeHandle = null;
            let startX, startY, startLeft, startTop, startWidth, startHeight;

            stampEl.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('stamp-close-btn')) return;

                if (e.target.classList.contains('stamp-resize-handle')) {
                    isResizing = true;
                    currentResizeHandle = e.target;
                } else {
                    isDragging = true;
                }

                startX = e.clientX;
                startY = e.clientY;
                startLeft = parseFloat(stampEl.style.left) || 0;
                startTop = parseFloat(stampEl.style.top) || 0;
                startWidth = parseFloat(stampEl.style.width) || 120;
                startHeight = parseFloat(stampEl.style.height) || 120;

                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging && !isResizing) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                if (isDragging && activeStamp) {
                    if (!stampEl || !stampEl.parentNode) { isDragging = false; return; }

                    // Kiểm tra nếu con trỏ chuột di chuyển sang trang PDF khác
                    const elementsUnderCursor = document.elementsFromPoint(e.clientX, e.clientY);
                    for (const el of elementsUnderCursor) {
                        if (el.classList.contains('page-wrapper') && el !== activeStamp.wrapper) {
                            const pageNum = parseInt(el.dataset.pageNumber, 10);
                            if (isNaN(pageNum)) continue;
                            const targetPage = renderedPages.find(p => p.pageNum === pageNum);
                            if (targetPage) {
                                el.appendChild(stampEl);
                                activeStamp.wrapper = el;
                                activeStamp.targetPageObj = targetPage;
                                activeStamp.pageNumber = pageNum;
                                
                                const newRect = el.getBoundingClientRect();
                                startLeft = e.clientX - newRect.left - (stampEl.offsetWidth / 2);
                                startTop = e.clientY - newRect.top - (stampEl.offsetHeight / 2);
                                startX = e.clientX;
                                startY = e.clientY;
                                break;
                            }
                        }
                    }

                    const maxLeft = activeStamp.wrapper.clientWidth - stampEl.offsetWidth;
                    const maxTop = activeStamp.wrapper.clientHeight - stampEl.offsetHeight;

                    let newLeft = Math.max(0, Math.min(startLeft + dx, maxLeft));
                    let newTop = Math.max(0, Math.min(startTop + dy, maxTop));

                    stampEl.style.left = `${newLeft}px`;
                    stampEl.style.top = `${newTop}px`;
                    updateStampCoordinates();
                } else if (isResizing && activeStamp) {
                    if (!currentResizeHandle) { isResizing = false; return; }
                    let newWidth = startWidth;
                    let newHeight = startHeight;
                    let newLeft = startLeft;
                    let newTop = startTop;

                    if (currentResizeHandle.classList.contains('resize-se')) {
                        newWidth = Math.max(60, startWidth + dx);
                        newHeight = Math.max(40, startHeight + dy);
                    } else if (currentResizeHandle.classList.contains('resize-sw')) {
                        newWidth = Math.max(60, startWidth - dx);
                        newHeight = Math.max(40, startHeight + dy);
                        newLeft = startLeft + (startWidth - newWidth);
                    } else if (currentResizeHandle.classList.contains('resize-ne')) {
                        newWidth = Math.max(60, startWidth + dx);
                        newHeight = Math.max(40, startHeight - dy);
                        newTop = startTop + (startHeight - newHeight);
                    } else if (currentResizeHandle.classList.contains('resize-nw')) {
                        newWidth = Math.max(60, startWidth - dx);
                        newHeight = Math.max(40, startHeight - dy);
                        newLeft = startLeft + (startWidth - newWidth);
                        newTop = startTop + (startHeight - newHeight);
                    }

                    stampEl.style.width = `${newWidth}px`;
                    stampEl.style.height = `${newHeight}px`;
                    stampEl.style.left = `${newLeft}px`;
                    stampEl.style.top = `${newTop}px`;
                    updateStampCoordinates();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDragging || isResizing) {
                    isDragging = false;
                    isResizing = false;
                    currentResizeHandle = null;
                }
            });
        }

        // TÍNH TOÁN TỌA ĐỘ PDF CHUẨN XÁC THEO HỆ TỌA ĐỘ GỐC (0,0) TẠI GÓC DƯỚI BÊN TRÁI
        function getStampPdfCoordinates() {
            if (!activeStamp || !activeStamp.element) return null;

            const el = activeStamp.element;
            const p = activeStamp.targetPageObj;
            if (!p || !p.wrapper) return null;
            const scale = p.scale;
            if (!scale || scale <= 0) return null;

            const domLeft = parseFloat(el.style.left) || 0;
            const domTop = parseFloat(el.style.top) || 0;
            const domWidth = parseFloat(el.style.width) || 0;
            const domHeight = parseFloat(el.style.height) || 0;

            // Chuyển đổi từ Pixel màn hình sang Point của PDF (1 inch = 72 points)
            const pdfX = Math.round((domLeft / scale) * 100) / 100;
            const pdfWidth = Math.round((domWidth / scale) * 100) / 100;
            const pdfHeight = Math.round((domHeight / scale) * 100) / 100;

            // Trong PDF: Trục Y có gốc (0,0) ở ĐÁY trang, đi lên trên
            // Trong HTML: Trục Y có gốc (0,0) ở ĐỈNH trang, đi xuống dưới
            const pdfY = Math.round(((p.wrapper.clientHeight - (domTop + domHeight)) / scale) * 100) / 100;

            return {
                pageNumber: p.pageNum,
                x: pdfX,
                y: pdfY,
                width: pdfWidth,
                height: pdfHeight
            };
        }

        function updateStampCoordinates() {
            const coords = getStampPdfCoordinates();
            if (!coords) return;

            const label = document.getElementById('stamp-coords-label');
            if (label) {
                label.innerText = `Trang ${coords.pageNumber} • X: ${Math.round(coords.x)}, Y: ${Math.round(coords.y)} • ${Math.round(coords.width)}x${Math.round(coords.height)}pt`;
            }

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'stampCoordinatesChanged',
                    coords: coords
                });
            }
        }
    </script>
</body>
